<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo-js</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="title">TODO</h1>

      <form id="todo-form" class="input-bar" aria-label="할 일 추가">
        <label class="sr-only" for="todo-input">할 일 입력</label>
        <input
          id="todo-input"
          type="text"
          placeholder="할 일을 입력하고 Enter를 누르세요"
          required
        />
      </form>

      <section class="board">
        <div class="column">
          <h2>해야 할 일</h2>
          <ul id="todo-list" class="list" aria-live="polite"></ul>
        </div>

        <div class="column">
          <h2>해낸 일</h2>
          <ul id="done-list" class="list" aria-live="polite"></ul>
        </div>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
